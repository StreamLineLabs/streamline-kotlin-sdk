name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Publication is gated on this job succeeding against a real Streamline
  # server fixture (docker-compose.test.yml) — the same live-server contract
  # exercised in ci.yml's `integration-test` job. There is no unit-test
  # fallback: `integrationTest` fails closed (see IntegrationTest.kt's
  # `requireIntegrationTask()`) rather than silently no-op'ing if the fixture
  # is unreachable, so this job cannot pass without the real server.
  integration-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Start Streamline
        run: docker compose -f docker-compose.test.yml up -d

      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9094/health/live > /dev/null 2>&1; then
              echo "Server is ready"
              exit 0
            fi
            echo "Waiting for Streamline... ($i/30)"
            sleep 2
          done
          echo "Server failed to start" && exit 1

      - name: Run integration tests
        run: ./gradlew integrationTest

      - name: Streamline logs
        if: failure()
        run: docker compose -f docker-compose.test.yml logs --no-color

      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  release:
    needs: [integration-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify release tag and metadata
        run: ./gradlew verifyReleaseTag -PreleaseTag="${GITHUB_REF_NAME}"

      - name: Verify and package
        run: ./gradlew clean ktlintCheck apiCheck compileExamplesKotlin test build cyclonedxBom publishToMavenLocal

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            build/libs/*.jar
            build/reports/bom.json
            build/reports/bom.xml

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            build/libs/*.jar
            build/reports/bom.json
            build/reports/bom.xml
