name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1' # Weekly Monday 4am UTC
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      streamline:
        image: ghcr.io/streamlinelabs/streamline:latest
        ports:
          - 9092:9092
          - 9094:9094
    steps:
      - uses: actions/checkout@v4
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Wait for Streamline
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9094/health/live; then
              echo "Streamline is ready"
              exit 0
            fi
            echo "Waiting for Streamline... ($i/30)"
            sleep 2
          done
          echo "Streamline failed to become healthy"
          exit 1
      - name: Run integration tests
        run: ./gradlew integrationTest --no-daemon
        env:
          STREAMLINE_WS_URL: ws://localhost:9092
          STREAMLINE_HTTP_URL: http://localhost:9094
